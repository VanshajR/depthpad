[package]
name = "depthpad-core"
description = "Keyboard protocol, input fusion and virtual controller engine for Depthpad"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
vigem-client = { version = "0.1.4", features = ["unstable_ds4"] }
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_Devices_HumanInterfaceDevice", "Win32_Storage_FileSystem", "Win32_System_IO",
    "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_Media", "Win32_Media_Audio", "Win32_UI_HiDpi", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Gdi",
] }
