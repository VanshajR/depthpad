[package]
name = "depthpad"
description = "Analog game controller for the AJAZZ AK680 V2 HE"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "depthpad_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
depthpad-core = { path = "../crates/depthpad-core" }
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-autostart = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
# to switch off WebView2's browser behaviour (context menu, Ctrl+P/R/F, zoom); same versions as Tauri's
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
