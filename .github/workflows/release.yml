name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml, package.json and tauri.conf.json)
# to build the installer, portable zip and keyboard report tool, and create a draft release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  VIGEMBUS: ViGEmBus_1.22.0_x64_x86_arm64.exe
  VIGEMBUS_SHA256: 89220a7865076b342892f98865f3499fb7c4cfd673159e89d352c360fd014c6a

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: v
        shell: bash
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          grep -q "\"version\": \"$V\"" src-tauri/tauri.conf.json || { echo "tauri.conf.json version differs from Cargo.toml ($V)"; exit 1; }
          grep -q "\"version\": \"$V\"" package.json || { echo "package.json version differs from Cargo.toml ($V)"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$V" ]; then echo "tag $GITHUB_REF_NAME doesn't match version $V"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci

      - name: ViGEmBus installer (downloaded and checked, not committed)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/redist | Out-Null
          Invoke-WebRequest "https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/$env:VIGEMBUS" -OutFile "src-tauri/redist/$env:VIGEMBUS"
          $h = (Get-FileHash "src-tauri/redist/$env:VIGEMBUS" -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:VIGEMBUS_SHA256) { throw "ViGEmBus installer checksum mismatch: $h" }

      - name: Tests
        run: |
          npm run check
          npm run build
          cargo build --release --locked -p depthpad-probe
          cargo test --workspace --locked

      - name: Build
        run: npx tauri build
        env:
          # signs the installer for in-app updates (the public key is in tauri.conf.json)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          New-Item -ItemType Directory -Force out, portable/Depthpad | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe out/
          Copy-Item target/release/depthpad-probe.exe "out/depthpad-probe-$v.exe"
          Copy-Item target/release/depthpad.exe, target/release/depthpad-probe.exe, LICENSE, THIRD_PARTY_NOTICES.md portable/Depthpad/
          Copy-Item -Recurse licenses portable/Depthpad/licenses
          Compress-Archive -Path portable/Depthpad -DestinationPath "out/Depthpad_${v}_x64-portable.zip"
          # what the app's updater reads: the release's installer and its signature
          $setup = "Depthpad_${v}_x64-setup.exe"
          $sig = Get-Content -Raw "target/release/bundle/nsis/$setup.sig"
          @{
            version = $v
            notes = "See https://github.com/VanshajR/depthpad/releases/tag/v$v"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $sig.Trim(); url = "https://github.com/VanshajR/depthpad/releases/download/v$v/$setup" } }
          } | ConvertTo-Json -Depth 4 | Out-File -Encoding utf8NoBOM out/latest.json
          # hash first, then write the list (writing into out/ while listing it would hash the list itself)
          $sums = Get-ChildItem out -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          $sums | Out-File -Encoding ascii SHA256SUMS.txt
          Move-Item SHA256SUMS.txt out/
          Get-Content out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: depthpad-${{ steps.v.outputs.version }}
          path: out/*

      - name: Draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/*
