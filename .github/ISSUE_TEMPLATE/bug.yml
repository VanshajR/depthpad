name: Bug report
description: Something doesn't work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: keyboard
    attributes:
      label: Keyboard
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Depthpad version and Windows version
      placeholder: e.g. 0.1.0 on Windows 11 24H2
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game or app, if it's specific to one
  - type: textarea
    id: recording
    attributes:
      label: Session recording (optional)
      description: For input problems, About → Record a session while reproducing it, then attach the file. It contains every key pressed while recording, so read it first.
