# Link the Visual C++ runtime statically so Depthpad.exe runs on a clean Windows install
# without the VC++ Redistributable (no vcruntime140.dll dependency).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
